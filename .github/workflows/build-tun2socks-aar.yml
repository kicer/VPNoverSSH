# Builds tun2socks.aar with remote DNS support, as implemented in
# xjasonlyu/tun2socks PR #374 (final commit b69e505 "Implement fake DNS"),
# plus the Android adaptation from patches/tun2socks-android-fakedns/
# (fake DNS answered inside the TUN stack; apps cannot bind UDP port 53).
#
# The build is a standard `gomobile bind` of the tun2socks `engine` package,
# which produces exactly the same AAR layout as the one currently vendored in
# app/libs/ (classes.jar with engine.Key / engine.Engine + libgojni.so for
# 4 ABIs).
#
# Usage:
#   1. Run this workflow manually (Actions tab -> "Build tun2socks AAR" ->
#      Run workflow).
#   2. Download the `tun2socks-remote-dns` artifact from the run.
#   3. Replace app/libs/tun2socks.aar with the `tun2socks.aar` from the
#      artifact, commit, and build the app as usual.

name: Build tun2socks AAR

on:
  workflow_dispatch:
    inputs:
      tun2socks_ref:
        description: >-
          tun2socks ref to build. Default is the head of PR #374 (remote DNS).
        required: false
        default: 'refs/pull/374/head'

permissions:
  contents: read

jobs:
  build-aar:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: '26.1.10909125'
      CMDLINE_TOOLS_BUILD: '11076708'
      # gomobile@latest / x-mobile@latest currently require a recent Go
      # toolchain; gvisor (used by tun2socks' netstack) tracks Go releases and
      # builds fine. GOTOOLCHAIN=auto lets go fetch whatever toolchain a
      # dependency asks for during `go get`, without affecting which toolchain
      # actually compiles tun2socks.
      GO_VERSION: '1.24'
      GOTOOLCHAIN: auto
      XMOBILE_VERSION: latest
      # Self-contained SDK: the ubuntu-24.04 runner image does not reliably
      # provide sdkmanager on PATH, so we install everything ourselves.
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout this repository (for patches)
        uses: actions/checkout@v4

      - name: Checkout tun2socks
        uses: actions/checkout@v4
        with:
          repository: xjasonlyu/tun2socks
          ref: ${{ inputs.tun2socks_ref }}
          path: tun2socks

      - name: Show revision being built
        run: git -C tun2socks log -1 --oneline

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: tun2socks/go.sum

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_BUILD}_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK and platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --verbose "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${XMOBILE_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialize gomobile
        run: gomobile init

      - name: Apply Android fake-DNS adaptation
        working-directory: tun2socks
        run: |
          # PR #374 answers DNS from a system-stack UDP/53 server, which an
          # app process cannot bind (privileged port, no CAP_NET_BIND_SERVICE).
          # Move the answer point into the TUN stack instead: drop in the
          # intercept helper and hook it into tunnel/udp.go before the proxy
          # dial, gated on destination port 53.
          cp "$GITHUB_WORKSPACE/patches/tun2socks-android-fakedns/dns/intercept.go" dns/intercept.go
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("tunnel/udp.go")
          src = p.read_text()
          anchor = "\tpc, err := proxy.DialUDP(metadata)"
          hook = ("\tif id.LocalPort == 53 && dns.Intercept(uc) {\n\t\treturn\n\t}\n\n" + anchor)
          n = src.count(anchor)
          assert n == 1, "unexpected anchor count in tunnel/udp.go: %d (PR head changed?)" % n
          p.write_text(src.replace(anchor, hook))
          print("tunnel/udp.go patched")
          PY

      - name: Build AAR (all ABIs, min API 26)
        working-directory: tun2socks
        env:
          # gomobile bind injects code that imports golang.org/x/mobile/bind,
          # which may not yet be listed in require; -mod=mod lets the go
          # command update go.mod/go.sum during the build.
          GOFLAGS: -mod=mod
        run: |
          # gomobile requires golang.org/x/mobile to be in the bound module's
          # dependency graph. Record the gobind tool + bind runtime package so
          # gomobile's check passes and versions stay aligned with the
          # installed gomobile.
          go get -tool golang.org/x/mobile/cmd/gobind
          go get golang.org/x/mobile/bind
          go mod tidy
          gomobile bind -v \
            -target=android \
            -androidapi 26 \
            -ldflags="-s -w" \
            -o tun2socks.aar \
            ./engine

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: tun2socks-remote-dns
          path: tun2socks/tun2socks.aar
          retention-days: 90
